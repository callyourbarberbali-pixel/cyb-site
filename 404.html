    font-size:.74rem;font-weight:600;padding:16px 34px;cursor:pointer;

  .btn-line{color:var(--gold-soft);border:1px solid var(--gold);background:transparent}

  .links{margin-top:40px;display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center}
  .links a{
    color:var(--muted);text-decoration:none;text-transform:uppercase;
    letter-spacing:.18em;font-size:.66rem;font-weight:600;transition:.25s;
  }
  .links a:hover{color:var(--gold)}
  @media(max-width:520px){
